[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-proxy"
version = "0.1.0"
description = "Free Antigravity 2.0 custom-agent proxy: drive Google Antigravity's agent loop from any OpenAI- or Anthropic-compatible client, with your own presets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-antigravity>=0.1.21,<0.2",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
]

[project.scripts]
agy-proxy = "agy_proxy.__main__:main"

[tool.setuptools.packages.find]
include = ["agy_proxy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tests use long inline event-list literals that read better unwrapped.
"tests/*" = ["E501"]
